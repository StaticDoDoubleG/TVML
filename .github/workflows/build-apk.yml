name: Build APK

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          # Default installs the removed 'tools' package, which fails on current cmdline-tools
          packages: ''

      # The Android Gradle Plugin downloads the compileSdk platform, build-tools
      # and the NDK pinned in app/build.gradle automatically (licenses accepted above).
      - name: Build nonRoot release APK
        run: ./gradlew --no-daemon assembleNonRootRelease

      - uses: actions/upload-artifact@v4
        with:
          name: tvml-apk
          path: app/build/outputs/apk/nonRoot/release/*.apk
